<app-public-nav></app-public-nav>

<main class="auth-page">
  <div class="container-narrow">
    <div class="auth-card card">
      <div class="auth-header text-center">
        <div class="auth-brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        </div>
        <h1 class="auth-title">Sign in to EasyFin Tech</h1>
        <p class="auth-subtitle">Access your bank statement conversion workspace</p>
      </div>

      <div *ngIf="errorMessage" class="auth-error-alert" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onLogin()" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Work Email</label>
          <input type="email" id="loginEmail" name="email" [(ngModel)]="email" class="form-control" placeholder="name@firm.com" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="loginPassword">Password</label>
            <span class="forgot-link">Forgot password?</span>
          </div>
          <input type="password" id="loginPassword" name="password" [(ngModel)]="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
            <span>Remember this device for 30 days</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In to Dashboard</span>
          <span *ngIf="isLoading">Authenticating...</span>
          <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer text-center">
        <span>Need a workspace? </span>
        <a routerLink="/signup" class="auth-link">Create an account &rarr;</a>
      </div>
    </div>
  </div>
</main>

<app-public-footer></app-public-footer>
