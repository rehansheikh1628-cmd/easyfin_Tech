<div class="workspace-layout">
  <!-- Top Horizontal Navigation Bar across full viewport -->
  <app-public-nav></app-public-nav>

  <!-- Slim Workspace Context Subbar -->
  <header class="workspace-subbar">
    <div class="container subbar-container">
      <!-- Dynamic Breadcrumb Navigation -->
      <nav class="subbar-breadcrumb" aria-label="Breadcrumb Navigation">
        <span class="subbar-category">{{ breadcrumbCategory }}</span>
        <span class="subbar-sep" aria-hidden="true">/</span>
        <span class="subbar-current font-bold">{{ breadcrumbTitle }}</span>
      </nav>

      <!-- System Connectivity & Tenant Context -->
      <div class="subbar-meta">
        <div class="db-pill" title="System Connectivity: Data Connected">
          <span class="db-dot" aria-hidden="true"></span>
          <span class="db-text">Data Connected</span>
        </div>
        <span class="subbar-meta-sep" aria-hidden="true">&bull;</span>
        <span class="subbar-tenant">{{ workspaceName }}</span>
      </div>
    </div>
  </header>

  <!-- Workspace Content Surface (Full Viewport Width) -->
  <main class="workspace-content" id="workspace-main">
    <router-outlet></router-outlet>
  </main>
</div>
