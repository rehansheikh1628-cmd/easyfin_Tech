<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background rounded card gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Symbol Gradients -->
    <linearGradient id="mark-blue" x1="30" y1="95" x2="80" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="mark-mint" x1="60" y1="65" x2="95" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)"/>

  <!-- Centered Accufex Apex Glyph -->
  <g transform="translate(18, 14)">
    <!-- Left Apex Stem -->
    <path d="M 12 84 L 38 20 C 40 15 45 15 47 20 L 59 48 L 44 68 L 30 68 L 12 84 Z" fill="url(#mark-blue)"/>
    
    <!-- Right Anchor Stem -->
    <path d="M 42 64 L 54 42 L 78 80 C 80 83 78 86 74 86 L 50 86 C 46 86 44 83 42 80 Z" fill="#1D4ED8"/>
    
    <!-- Top Precision Chevron -->
    <path d="M 48 50 L 66 22 C 68 18 73 18 75 22 L 85 40 C 86 42 85 44 83 45 L 58 60 C 54 62 50 58 48 50 Z" fill="url(#mark-mint)"/>
    
    <!-- Precision Pivot Point -->
    <circle cx="50" cy="59" r="4" fill="#FFFFFF"/>
  </g>
</svg>
